<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirLearn - تشخيص تتبع اليد</title><style>body{background:#071324;color:#e4f5ff;font:16px Tahoma,Arial;padding:25px;max-width:850px;margin:auto}h1{color:#5be7ff}button{background:#0d6584;color:white;padding:14px;border:0;border-radius:10px;font-size:16px;cursor:pointer}article{padding:12px;margin:10px 0;border:1px solid #2b5067;border-radius:12px;overflow-wrap:anywhere}small{color:#9cbad0}pre{white-space:pre-wrap}</style><h1>AirLearn AI – فحص تشغيل الذكاء الاصطناعي</h1><p>هذه الصفحة تختبر الوصول إلى ملفات التتبع، دون استخدام الكاميرا أو إرسال صور.</p><button id="run">بدء الفحص</button><button id="copy">نسخ التقرير</button><div id="results"></div><script>
const tests=[['MediaPipe JavaScript - jsDelivr','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs'],['MediaPipe JavaScript - unpkg','https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs'],['MediaPipe WASM loader','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm/vision_wasm_internal.js'],['Hand Landmarker model','https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'],['Three.js','https://esm.sh/three@0.160.1']];
let report='';
async function check(name,url){const a=document.createElement('article');document.querySelector('#results').append(a);a.textContent='⏳ '+name;let controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{let r=await fetch(url,{method:'GET',mode:'cors',signal:controller.signal});let b=await r.body?.getReader()?.read();let msg=(r.ok?'✅ ':'❌ ')+name+' — HTTP '+r.status+(r.ok?' / accessible':' / unavailable');a.textContent=msg;report+=msg+'\n'+url+'\n';}catch(e){let msg='❌ '+name+' — '+(e.name==='AbortError'?'timeout':e.message);a.textContent=msg;report+=msg+'\n'+url+'\n';}finally{clearTimeout(timeout)}}
document.querySelector('#run').onclick=async()=>{report='AirLearn Diagnostics\nBrowser: '+navigator.userAgent+'\nSecure context: '+isSecureContext+'\n';document.querySelector('#results').innerHTML='';for(let [n,u] of tests)await check(n,u);let p=document.createElement('article');p.textContent='اكتمل الفحص. اضغط نسخ التقرير وأرسله في المحادثة.';document.querySelector('#results').append(p)};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);alert('تم نسخ التقرير')}catch(e){prompt('انسخ التقرير',report)}};
</script></html>
